apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: chat }
            - { name: POSTGRES_DB, value: chat }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: chat-secret, key: db-password } }
          ports: [{ containerPort: 5432 }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: chat-backend }
spec:
  replicas: 3
  selector: { matchLabels: { app: chat-backend } }
  template:
    metadata:
      labels: { app: chat-backend }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "3000", prometheus.io/path: /metrics }
    spec:
      containers:
        - name: backend
          image: ghcr.io/YOUR_GITHUB_USERNAME/chat-backend:latest
          ports: [{ containerPort: 3000 }]
          env:
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: chat-secret, key: db-password } }
            - { name: DATABASE_URL, value: "postgres://chat:$(DB_PASSWORD)@postgres:5432/chat" }
          readinessProbe: { httpGet: { path: /health, port: 3000 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 3000 }, initialDelaySeconds: 15 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: chat-backend }
spec:
  type: NodePort
  selector: { app: chat-backend }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: chat-backend }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: chat-backend }
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
