name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install && npm test
        working-directory: backend
      - name: Scan for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with: { scan-type: fs, scan-ref: backend, severity: 'CRITICAL,HIGH', exit-code: '0' }
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/chat-backend:latest,ghcr.io/${{ github.repository_owner }}/chat-backend:${{ github.sha }}
